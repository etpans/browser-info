<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple page that responds to your input and tab activity.">
    <title>Activity detector</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside class="browser-info" aria-label="Browser information">
      <dl>
        <div><dt>Screen</dt><dd id="info-screen">—</dd></div>
        <div><dt>Window</dt><dd id="info-window">—</dd></div>
        <div><dt>Pixels</dt><dd id="info-pixels">—</dd></div>
        <div><dt>Orientation</dt><dd id="info-orientation">—</dd></div>
        <div><dt>CPU threads</dt><dd id="info-cpu">—</dd></div>
        <div><dt>Touch points</dt><dd id="info-touch">—</dd></div>
        <div><dt>Language</dt><dd id="info-language">—</dd></div>
        <div><dt>Network</dt><dd id="info-network">—</dd></div>
        <div><dt>Timezone</dt><dd id="info-timezone">—</dd></div>
        <div><dt>Appearance</dt><dd id="info-appearance">—</dd></div>
        <div><dt>Location</dt><dd><button id="location-request" type="button">Allow location</button><span id="info-location" role="status"></span></dd></div>
      </dl>
    </aside>
    <main>
      <h1 id="status" role="status" aria-live="polite">Hello, you're here.</h1>
      <p>Move, click, type, or switch tabs.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
